<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17252b">
    <title>Sling Lab — физическая песочница</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <canvas id="game-canvas" aria-label="Игровое поле с рогаткой и башнями"></canvas>
    <main class="game-ui" aria-label="Интерфейс игры">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none">
              <path d="M11 31 16 9m13 22L24 9M11 31l9-9 9 9" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="m16 9 4 4 4-4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span class="brand-copy">
            <span class="brand-kicker">PHYSICS PLAYGROUND</span>
            <span class="brand-title">SLING LAB</span>
          </span>
        </div>

        <div class="level-chip">
          <span class="level-dot" aria-hidden="true"></span>
          <span class="level-name">Уровень 01</span>
          <span class="level-divider" aria-hidden="true"></span>
          <span class="level-detail">Учебная башня</span>
        </div>

        <div class="top-actions">
          <div class="ammo-card">
            <span class="ammo-label">СНАРЯДЫ</span>
            <span class="ammo-pips" id="shots-indicator" aria-hidden="true">
              <i class="ammo-pip" data-index="0"></i>
              <i class="ammo-pip" data-index="1"></i>
              <i class="ammo-pip" data-index="2"></i>
            </span>
            <strong id="shots-label" class="ammo-count" aria-label="Осталось бросков: 3 из 3">3</strong>
          </div>
          <button id="restart-button" class="restart-button" type="button" aria-label="Перезапустить уровень, клавиша R">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M16.2 8A6.4 6.4 0 0 0 5.4 5.7L4 7.2M3.8 4.2v3.2H7m-3.2 4.6A6.4 6.4 0 0 0 14.6 14l1.4-1.2M16.2 15.8v-3.2H13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>Заново</span>
            <kbd>R</kbd>
          </button>
        </div>
      </header>

      <div id="status-label" class="status-pill" data-state="ready" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-text">Потяни снаряд назад и отпусти</span>
      </div>

      <footer class="bottom-bar">
        <div class="instruction-card">
          <span class="instruction-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M5 12h13m-5-5 5 5-5 5M5 7v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span class="instruction-copy">
            <strong>Сбей все 5 целей</strong>
            <span>Потяни снаряд назад и отпусти — стрелка покажет путь до удара</span>
          </span>
        </div>

        <div class="material-legend" aria-label="Материалы блоков">
          <span class="legend-item"><i class="legend-swatch glass"></i>Стекло</span>
          <span class="legend-item"><i class="legend-swatch wood"></i>Дерево</span>
          <span class="legend-item"><i class="legend-swatch stone"></i>Камень</span>
        </div>
      </footer>
    </main>
    <div id="boot-error" class="boot-error" role="alert" hidden>
      <strong>Игровая сцена не загрузилась</strong>
      <span>Запусти start.bat. Для загрузки Matter.js нужно подключение к интернету.</span>
    </div>
    <script>
      const bootError = document.querySelector("#boot-error");
      const showBootError = () => { bootError.hidden = false; };
      window.addEventListener("error", () => {
        if (!document.documentElement.dataset.gameReady) showBootError();
      }, true);
      window.setTimeout(() => {
        if (!document.documentElement.dataset.gameReady) showBootError();
      }, 2500);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
